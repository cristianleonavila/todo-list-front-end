<div class="app-content-header">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card mt-2">
          <div class="card-header">
            <div class="card-title">
              <h3>Test Form Validation</h3>
            </div>
          </div>
          <div class="card-body">
            <form [formGroup]="testForm">
              <div class="mb-3">
                <label class="form-label">Name:
                  <input type="text" class="form-control" formControlName="name" appInvalidClass/>
                  <div app-form-error [control]="testForm.controls.name" [messages]="errorsModel" controlName="name"></div>
                </label>
                <div class="mb-3">
                  <label class="form-label">Age:
                    <input type="text" class="form-control" formControlName="age" appInvalidClass>
                    <div app-form-error [control]="testForm.controls.age" [messages]="errorsModel" controlName="age"></div>
                  </label>
                </div>
              </div>
              <div class="d-flex justify-content-end gap-2">
                <button type="submit" class="btn btn-primary">
                  Guardar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
