<div class="app-content-header">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card mt-2">
          <div class="card-header">
            <div class="card-title">
              <h3>Registrar Tarea</h3>
            </div>
          </div>
          <div class="card-body">
            <form [formGroup]="todoForm" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label class="form-label w-100">Título
                  <input type="text" class="form-control" formControlName="title" appInvalidClass>
                  <input type="hidden" formControlName="id">
                  <div app-form-error [control]="todoForm.controls.title" controlName="title" [messages]="errorsModel"></div>
                </label>
              </div>
              <div class="mb-3">
                <label class="form-label w-100">Descripción
                  <textarea formControlName="description" class="form-control" appInvalidClass></textarea>
                  <div app-form-error [control]="todoForm.controls.description" controlName="description" [messages]="errorsModel"></div>
                </label>
              </div>
              <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-secondary" (click)="newTodo()">
                  <i class="bi bi-file-earmark"></i>
                  Nuevo
                </button>
                @if (!todoId()) {
                  <button type="submit" class="btn btn-primary" [disabled]="isLoading()">
                    @if(isLoading()) {
                      <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Procesando...
                    } @else {
                      <i class="bi bi-floppy"></i> Guardar
                    }
                  </button>
                } @else {
                  <button type="submit" class="btn btn-success" [disabled]="isLoading()">
                    @if(isLoading()) {
                      <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Procesando...
                    } @else {
                      <i class="bi bi-arrow-clockwise"></i> Actualizar
                    }
                  </button>
                }

              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
