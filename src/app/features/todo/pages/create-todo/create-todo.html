<div class="app-content-header">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card mt-2">
          <div class="card-header">
            <div class="card-title">
              <h3>Registrar Tarea</h3>
            </div>
          </div>
          <div class="card-body">
            <form [formGroup]="todoForm" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label class="form-label w-100">Título
                  <input type="email" class="form-control" formControlName="title" [ngClass]="{'is-invalid': isFieldInvalid('title')}">
                  @if (isFieldInvalid('title')) {
                  <div class="invalid-feedback">
                    Debe ingresar el título.
                  </div>
                  }
                </label>
              </div>
              <div class="mb-3">
                <label class="form-label w-100">Descripción
                  <textarea formControlName="description" class="form-control"></textarea>
                </label>
              </div>
              <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-secondary">
                  Limpiar
                </button>
                <button type="submit" class="btn btn-primary">
                  Guardar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
